# Compile l'appli Android ABEF Sentiers à chaque envoi sur GitHub.
# Résultat : onglet « Actions » > dernière exécution > « abef-sentiers-apk » (fichier .apk à installer).
name: Appli Android

on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Dépendances
        run: npm ci

      - name: Copie de la carte dans l'appli
        run: npx cap sync android

      - name: Compilation
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Nom du fichier
        run: cp android/app/build/outputs/apk/debug/app-debug.apk abef-sentiers.apk

      - uses: actions/upload-artifact@v4
        with:
          name: abef-sentiers-apk
          path: abef-sentiers.apk
          retention-days: 30
