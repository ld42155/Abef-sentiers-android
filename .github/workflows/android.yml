# Compile l'appli Android ABEF Sentiers à chaque envoi sur GitHub.
# Résultat : onglet « Actions » > dernière exécution > « abef-sentiers-apk » (fichier .apk à installer).
name: Appli Android

on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Dépendances
        run: npm ci

      - name: Copie de la carte dans l'appli
        run: npx cap sync android

      - name: Compilation
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Nom du fichier
        run: cp android/app/build/outputs/apk/debug/app-debug.apk abef-sentiers.apk

      - uses: actions/upload-artifact@v4
        with:
          name: abef-sentiers-apk
          path: abef-sentiers.apk
          retention-days: 30

      # Lien fixe vers la dernière version, à ouvrir sur le téléphone :
      # https://github.com/<compte>/<dépôt>/releases/download/appli/abef-sentiers.apk
      - name: Publication de la dernière version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete appli --yes --cleanup-tag || true
          gh release create appli abef-sentiers.apk --target "$GITHUB_SHA" --title "ABEF Sentiers : dernière version" --notes "Appli Android compilée depuis la version ${GITHUB_SHA::7} (branche ${GITHUB_REF_NAME})."
