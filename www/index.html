<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="description" content="Tracer un parcours à pied ou à vélo sur tous les chemins (OpenStreetMap et IGN), distance, dénivelé, temps, enregistrement GPS et export GPX.">
<meta name="theme-color" content="#1b241f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sentiers">
<title>ABEF Sentiers</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231b241f'/%3E%3Crect x='7' y='9' width='18' height='5' fill='white'/%3E%3Crect x='7' y='18' width='18' height='5' fill='%23d42b1e'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="leaflet/leaflet.css">
<style>
/*
VOICE: outil de terrain, sobre, lisible en plein soleil
IDEA: le balisage de randonnée (rouge et blanc des GR) posé sur la carte IGN
PICTURE: la carte plein écran, le tracé rouge cerclé de blanc
COLOUR and TYPE: blanc, encre vert-noir, rouge balisage, bleu GPS ; police système, chiffres tabulaires
LAYOUT: carte pleine page ; panneau latéral sur ordinateur, feuille basse sur téléphone ; boutons ronds à droite
*/
:root{--bg:#fff;--bg2:#f1f3ef;--ink:#1b241f;--mute:#5b665f;--line:#dce0d9;--red:#d42b1e;--redk:#b5241a;--yel:#f2c418;--blue:#1668d6;--ok:#1f8f4e;--vio:#7a3fb8;--sh:0 8px 28px rgba(0,0,0,.18),0 1px 3px rgba(0,0,0,.14);--ph:0px;--st:max(env(safe-area-inset-top,0px),var(--safe-area-inset-top,0px));--sb:max(env(safe-area-inset-bottom,0px),var(--safe-area-inset-bottom,0px));color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#161b18;--bg2:#222924;--ink:#ebefe8;--mute:#a3ada6;--line:#343d37;--redk:#ff6d60;--vio:#b78cf0;color-scheme:dark}}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0}
body{font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg2);overflow:hidden;-webkit-tap-highlight-color:transparent}
#map{position:fixed;inset:0;background:#e8eae5}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.ic{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

.top{position:fixed;z-index:1000;top:calc(var(--st) + 10px);left:10px;right:68px}
.search{position:relative;display:flex;align-items:center;background:var(--bg);border-radius:12px;box-shadow:var(--sh);height:48px;padding:0 4px 0 14px;max-width:460px;margin:0}
.search input{flex:1;border:0;background:transparent;font-size:16px;outline:none;height:100%}
.search input::-webkit-search-cancel-button{display:none}
.search>button{border:0;background:transparent;width:42px;height:42px;display:grid;place-items:center;border-radius:10px;color:var(--mute)}
.results{position:absolute;top:54px;left:0;right:0;background:var(--bg);border-radius:12px;box-shadow:var(--sh);overflow:hidden}
.results button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:10px 14px;min-height:48px}
.results button:last-child{border-bottom:0}
.results small{display:block;color:var(--mute);font-size:13px}

.fabs{position:fixed;z-index:1000;top:calc(var(--st) + 10px);right:10px;display:flex;flex-direction:column;gap:10px}
.fab{width:48px;height:48px;border-radius:50%;border:0;background:var(--bg);color:var(--ink);box-shadow:var(--sh);display:grid;place-items:center}
.fab{position:relative}
.fab.on{background:var(--blue);color:#fff}
.badge{position:absolute;top:5px;right:5px;width:11px;height:11px;border-radius:50%;background:var(--yel);box-shadow:0 0 0 2px var(--bg)}
.fab.rec{color:var(--red)}
.fab.rec.on{background:var(--red);color:#fff}

.panel{position:fixed;z-index:1001;left:0;right:0;bottom:0;background:var(--bg);border-radius:18px 18px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.16);padding:2px 14px calc(var(--sb) + 12px);max-height:64vh;max-height:64dvh;overflow:auto;overscroll-behavior:contain}
.grab{display:block;width:100%;height:24px;border:0;background:transparent;position:relative;margin:0 0 2px}
.grab::before{content:"";position:absolute;left:50%;top:9px;width:44px;height:5px;margin-left:-22px;border-radius:3px;background:var(--line)}
.ph{display:none}
.more{display:none}
.panel.open .more{display:block}
.row{display:flex;gap:8px;align-items:center}
.seg{display:flex;flex:1;background:var(--bg2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;min-height:42px;border:0;border-radius:9px;background:transparent;color:var(--mute);font-weight:600;font-size:15px;white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--bg);color:var(--redk);box-shadow:0 1px 3px rgba(0,0,0,.16)}
.ibtn{width:48px;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--bg);display:grid;place-items:center;flex:none}
.hint{font-size:14px;color:var(--mute);margin:10px 2px 0}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;margin:12px 0 2px}
.stat b{display:block;font-size:20px;line-height:1.15;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat b small,.recgrid b small{font-size:14px;font-weight:600}
.stat>span{font-size:13px;color:var(--mute)}
.stat.t b{color:var(--redk)}
.stat select{border:0;background:transparent;color:var(--mute);font-size:13px;padding:0;margin:0 0 0 -2px;min-height:26px;max-width:100%}
.fig{position:relative;height:124px;margin:12px 0 4px;background:var(--bg2);border-radius:12px;overflow:hidden;touch-action:none}
.fig canvas{position:absolute;inset:0;width:100%;height:100%}
.fig .tip{position:absolute;top:6px;right:8px;font-size:13px;background:var(--bg);padding:2px 8px;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.16);pointer-events:none;white-space:nowrap}
.fig .empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--mute);font-size:14px;text-align:center;padding:0 16px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);font-size:15px;font-weight:500;text-align:center;text-decoration:none}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff;font-weight:600}
.btn.danger{color:var(--redk)}
.grid .btn{flex-direction:column;gap:3px;font-size:13px;min-height:60px;padding:6px 4px}
#traces h3{margin:14px 0 4px}
.chip{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:12px;padding:0 2px 0 12px;margin:6px 0}
.chip .lk{flex:1;text-align:left;border:0;background:transparent;min-height:42px;font-weight:600;color:var(--vio);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip .x{width:42px;height:42px;border:0;background:transparent;display:grid;place-items:center;color:var(--mute)}
.net{display:flex;align-items:center;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:14px;color:var(--mute)}
.net .dot{width:10px;height:10px;border-radius:50%;background:#9aa49d;flex:none}
.net .dot.busy{background:var(--yel);animation:pulse 1s infinite}
.net .dot.ok{background:var(--ok)}
.net .dot.err{background:var(--red)}
.net .dot.off{background:var(--yel)}
.net .btn{margin-left:auto;min-height:40px;font-size:14px;padding:0 10px;flex:none}
.legend{display:flex;gap:14px;font-size:13px;color:var(--mute);margin-top:8px;flex-wrap:wrap}
.legend i{display:inline-block;width:18px;height:4px;border-radius:2px;vertical-align:middle;margin-right:5px}
@keyframes pulse{50%{opacity:.3}}

.recbar{position:fixed;z-index:1002;top:calc(var(--st) + 66px);left:10px;right:68px;max-width:460px;background:var(--bg);border-radius:14px;box-shadow:var(--sh);padding:10px 12px 12px}
.recbar .head{display:flex;align-items:center;gap:8px;font-weight:700}
.recdot{width:12px;height:12px;border-radius:50%;background:var(--red);animation:pulse 1.2s infinite}
.recbar.paused .recdot{animation:none;background:var(--mute)}
.recgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:8px 0}
.recgrid b{display:block;font-size:19px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recgrid span{font-size:13px;color:var(--mute)}
.follow{font-size:14px;margin:0 0 8px}
.follow.off{color:var(--redk);font-weight:600}
.recbar .row .btn{flex:1}

.toast{position:fixed;z-index:3000;left:50%;bottom:calc(var(--ph) + 14px);transform:translateX(-50%);background:#1b241f;color:#fff;padding:10px 16px;border-radius:12px;font-size:15px;box-shadow:var(--sh);width:max-content;max-width:min(92vw,520px);opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.busy{position:fixed;z-index:2500;top:calc(var(--st) + 66px);left:50%;transform:translateX(-50%);background:var(--bg);color:var(--ink);border-radius:20px;padding:7px 14px 7px 12px;box-shadow:var(--sh);font-size:14px;display:none;align-items:center;gap:8px;white-space:nowrap}
.busy.on{display:flex}
.busy::before{content:"";width:14px;height:14px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--red);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.net .dot.busy,.recdot,.busy::before{animation:none}.toast{transition:none}}

dialog.dlg{border:0;border-radius:16px;padding:0;width:min(560px,94vw);max-height:88vh;max-height:88dvh;background:var(--bg);color:var(--ink);box-shadow:var(--sh)}
dialog.dlg::backdrop{background:rgba(10,15,12,.45)}
.dlg form{display:flex;flex-direction:column;max-height:88vh;max-height:88dvh;margin:0}
.dlg header{display:flex;align-items:center;gap:8px;padding:12px 10px 6px 18px}
.dlg h2{margin:0;font-size:19px;flex:1}
.dlg .x{width:44px;height:44px;border:0;background:transparent;border-radius:10px;display:grid;place-items:center;color:var(--mute)}
.dlg .body{padding:2px 18px 10px;overflow:auto}
.dlg footer{display:flex;flex-direction:row-reverse;gap:8px;justify-content:flex-start;padding:10px 14px 14px;flex-wrap:wrap;border-top:1px solid var(--line)}
.dlg p{margin:8px 0}
.field{display:block;margin:10px 0}
.field>span{display:block;font-size:14px;color:var(--mute);margin-bottom:4px}
.field input[type=text],.field input[type=number],.field input[type=password],.field input[type=url],.field select{width:100%;min-height:46px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:var(--bg);font-size:16px}
.check{display:flex;align-items:center;gap:10px;min-height:44px;font-size:15px;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--red);flex:none}
.check small{color:var(--mute);font-size:13px}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.lib{list-style:none;margin:0;padding:0}
.lib li{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0}
.lib .t{font-weight:650;overflow-wrap:anywhere}
.lib .m{font-size:13px;color:var(--mute)}
.lib .a{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.lib .a .btn{min-height:40px;font-size:14px;padding:0 10px}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:1px 7px;border-radius:6px;background:var(--bg2);color:var(--mute);margin-right:6px;vertical-align:1px}
.note{font-size:13px;color:var(--mute)}
.dlg h3{font-size:15px;margin:18px 0 2px}
.wrap{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.bar{height:10px;border-radius:6px;background:var(--bg2);overflow:hidden;margin:12px 0 6px}
.bar i{display:block;height:100%;width:0;background:var(--red);transition:width .25s}
.pstep{font-weight:600;margin:6px 0 0}
.lnk{width:100%;min-height:46px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:var(--bg2);font-size:14px}

.wp{width:30px;height:30px;display:grid;place-items:center}
.wp i{display:block;width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid #d42b1e;box-shadow:0 1px 3px rgba(0,0,0,.45)}
.wp.s i{width:20px;height:20px;background:#1f8f4e;border-color:#fff}
.wp.e i{width:20px;height:20px;background:#d42b1e;border-color:#fff}
.wp.f i{width:10px;height:10px;border-width:2px}
.km{display:inline-block;transform:translate(-50%,-50%);background:#fff;color:#b5241a;border:1.5px solid #b5241a;border-radius:7px;font:700 12px/16px system-ui,sans-serif;padding:0 4px;white-space:nowrap;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.wpt{display:inline-block;transform:translate(-50%,-100%);background:var(--vio);color:#fff;border-radius:7px;font:600 12px/18px system-ui,sans-serif;padding:0 6px;white-space:nowrap}
.popbtns{display:flex;flex-direction:column;gap:6px;min-width:200px}
.popbtns .btn{min-height:42px;font-size:14px;justify-content:flex-start}
.popbtns .num{color:var(--mute);font-size:13px}
.leaflet-popup-content{margin:12px 14px;font:14px/1.4 system-ui,sans-serif}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--bg);color:var(--ink);border-radius:12px}
.leaflet-container a.leaflet-popup-close-button{width:30px;height:30px;font-size:22px}
.leaflet-bottom{bottom:var(--ph)}
.leaflet-control-attribution{font-size:11px}
@media (max-width:899px){.leaflet-control-zoom{display:none}}

@media (min-width:900px){
  .panel{top:10px;left:10px;bottom:10px;right:auto;width:370px;border-radius:16px;max-height:none;padding:14px 16px 16px}
  .grab{display:none}
  .ph{display:block;margin:0 0 12px}
  .ph h1{margin:0;font-size:20px;line-height:1.2;display:flex;align-items:center;gap:10px}
  .mark{width:22px;height:16px;border-radius:3px;background:linear-gradient(#fff 0 44%,transparent 44% 56%,#d42b1e 56%);box-shadow:0 0 0 1.5px var(--line);flex:none}
  .ph p{margin:2px 0 0;color:var(--mute);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .more,.panel .more{display:block}
  .top,.recbar{left:394px}
  .leaflet-bottom{bottom:0}
  .toast{left:calc(50% + 190px);bottom:20px}
  .busy{left:calc(50% + 190px)}
}
@media (max-width:380px){.seg button{font-size:14px;gap:4px}.stat b{font-size:18px}}
</style>
</head>
<body>
<noscript><p style="padding:20px">Cette carte a besoin de JavaScript.</p></noscript>
<div id="map" aria-label="Carte"></div>

<div class="top">
  <form class="search" id="searchForm" role="search" autocomplete="off">
    <input id="q" type="search" placeholder="Lieu, adresse ou 45.83, 4.01" enterkeyhint="search" aria-label="Rechercher un lieu">
    <button type="submit" aria-label="Rechercher"><span data-ic="search"></span></button>
    <div class="results" id="results" hidden></div>
  </form>
</div>

<div class="fabs">
  <button type="button" class="fab" id="bLayers" title="Fonds de carte et calques" aria-label="Fonds de carte et calques"><span data-ic="layers"></span></button>
  <button type="button" class="fab" id="bLoc" title="Ma position" aria-label="Ma position"><span data-ic="locate"></span></button>
  <button type="button" class="fab rec" id="bRec" title="Enregistrer ma trace GPS" aria-label="Enregistrer ma trace GPS"><span data-ic="rec"></span></button>
  <button type="button" class="fab" id="bOff" title="Cartes hors ligne" aria-label="Cartes hors ligne"><span data-ic="offline"></span><i class="badge" id="offBadge" hidden></i></button>
  <button type="button" class="fab" id="bSet" title="Réglages" aria-label="Réglages"><span data-ic="gear"></span></button>
</div>

<div class="recbar" id="recbar" hidden role="region" aria-label="Enregistrement GPS">
  <div class="head"><span class="recdot"></span><span id="rState">Enregistrement GPS</span><span class="num" id="rTime" style="margin-left:auto">0:00:00</span></div>
  <div class="recgrid">
    <div><b id="rDist">0 m</b><span>Distance</span></div>
    <div><b id="rSpd">—</b><span>Vitesse</span></div>
    <div><b id="rUp">—</b><span>Montée (GPS)</span></div>
  </div>
  <div class="follow" id="rFollow" hidden></div>
  <div class="row"><button type="button" class="btn" id="rPause"><span data-ic="pause"></span><span>Pause</span></button><button type="button" class="btn primary" id="rStop"><span data-ic="stop"></span>Terminer</button></div>
</div>

<section class="panel" id="panel" aria-label="Parcours">
  <button type="button" class="grab" id="grab" aria-label="Afficher plus d’options" aria-expanded="false"></button>
  <header class="ph"><h1><span class="mark" aria-hidden="true"></span>ABEF Sentiers</h1><p id="rname">Nouveau parcours</p></header>
  <div class="row">
    <div class="seg" role="group" aria-label="Mode de tracé">
      <button type="button" id="mP" aria-pressed="true" title="Le tracé suit les chemins connus"><span data-ic="path"></span>Chemins</button>
      <button type="button" id="mL" aria-pressed="false" title="Le tracé va tout droit, partout"><span data-ic="line"></span>Ligne droite</button>
    </div>
    <button type="button" class="ibtn" id="bUndo" title="Annuler (Ctrl+Z)" aria-label="Annuler"><span data-ic="undo"></span></button>
  </div>
  <p class="hint" id="hint"></p>
  <div class="stats">
    <div class="stat"><b id="sDist">0 m</b><span>Distance</span></div>
    <div class="stat"><b id="sUp">—</b><span>Montée</span></div>
    <div class="stat"><b id="sDn">—</b><span>Descente</span></div>
    <div class="stat t"><b id="sTime">—</b><select id="prof" aria-label="Activité pour l’estimation du temps"><option value="marche">à pied</option><option value="vtt">en VTT</option><option value="route">vélo route</option></select></div>
  </div>
  <div class="more">
    <div class="fig" id="fig"><canvas id="cv"></canvas><div class="tip" id="tip" hidden></div><div class="empty" id="figEmpty">Profil altimétrique</div></div>
    <div class="grid">
      <button type="button" class="btn" id="bLoop"><span data-ic="loop"></span>Boucle</button>
      <button type="button" class="btn" id="bRev"><span data-ic="swap"></span>Inverser</button>
      <button type="button" class="btn" id="bFit"><span data-ic="fit"></span>Voir tout</button>
      <button type="button" class="btn" id="bSave"><span data-ic="save"></span>Enregistrer</button>
      <button type="button" class="btn" id="bExp"><span data-ic="download"></span>Exporter</button>
      <button type="button" class="btn" id="bShare"><span data-ic="link"></span>Lien</button>
      <button type="button" class="btn" id="bLib"><span data-ic="folder"></span>Mes parcours</button>
      <button type="button" class="btn" id="bImp"><span data-ic="upload"></span>Importer</button>
      <button type="button" class="btn danger" id="bNew"><span data-ic="trash"></span>Effacer</button>
    </div>
    <div id="traces"></div>
    <div class="net"><span class="dot" id="nDot"></span><span id="nTxt">Zoomez pour charger les chemins</span><button type="button" class="btn" id="bLoad">Charger ici</button></div>
    <div class="legend"><span><i style="background:#4b5d73"></i>Chemins OSM</span><span><i style="background:#e07b00"></i>En plus via l’IGN</span><span><i style="background:#d42b1e"></i>Votre tracé</span></div>
  </div>
</section>

<input type="file" id="fileIn" hidden>
<div class="busy" id="busy">Calcul du tracé…</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="leaflet/leaflet.js"></script>
<script src="capacitor.js"></script>
<script>
{
'use strict';
/* ================= utilitaires ================= */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const PFX = 'abefSentiers.';
const LS = {
  get(k, d){ try{ const v = localStorage.getItem(PFX + k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(PFX + k, JSON.stringify(v)); return true; }catch(e){ return false; } },
  del(k){ try{ localStorage.removeItem(PFX + k); }catch(e){} }
};
const sleep = ms => new Promise(r => setTimeout(r, ms));
const NETST = {down: 0};

/* ================= géométrie ================= */
const D2R = Math.PI / 180, RE = 6371008.8, RM = 6378137;
function hav(a, b){ const dLa = (b[0] - a[0]) * D2R, dLo = (b[1] - a[1]) * D2R; const s = Math.sin(dLa / 2) ** 2 + Math.cos(a[0] * D2R) * Math.cos(b[0] * D2R) * Math.sin(dLo / 2) ** 2; return 2 * RE * Math.asin(Math.min(1, Math.sqrt(s))); }
function lineLen(c){ let s = 0; for (let i = 1; i < c.length; i++) s += hav(c[i - 1], c[i]); return s; }
function cumLen(c){ const a = new Float64Array(c.length); for (let i = 1; i < c.length; i++) a[i] = a[i - 1] + hav(c[i - 1], c[i]); return a; }
function pointAt(c, cum, s){
  const tot = cum[cum.length - 1]; if (s <= 0) return c[0]; if (s >= tot) return c[c.length - 1];
  let lo = 0, hi = cum.length - 1; while (hi - lo > 1){ const m = (lo + hi) >> 1; if (cum[m] <= s) lo = m; else hi = m; }
  const sg = cum[hi] - cum[lo], t = sg > 0 ? (s - cum[lo]) / sg : 0;
  return [c[lo][0] + t * (c[hi][0] - c[lo][0]), c[lo][1] + t * (c[hi][1] - c[lo][1])];
}
function projSeg(p, a, b){
  const k = Math.cos(p[0] * D2R);
  const ax = (a[1] - p[1]) * k, ay = a[0] - p[0], bx = (b[1] - p[1]) * k, by = b[0] - p[0];
  const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy;
  let t = l2 > 0 ? -(ax * dx + ay * dy) / l2 : 0; t = t < 0 ? 0 : t > 1 ? 1 : t;
  const x = ax + t * dx, y = ay + t * dy;
  return {t, d: Math.sqrt(x * x + y * y) * D2R * RE, lat: a[0] + t * (b[0] - a[0]), lon: a[1] + t * (b[1] - a[1])};
}
const merc = (la, lo) => [RM * lo * D2R, RM * Math.log(Math.tan(Math.PI / 4 + la * D2R / 2))];
const unmerc = (x, y) => [(2 * Math.atan(Math.exp(y / RM)) - Math.PI / 2) / D2R, x / RM / D2R];
function cat(dst, src){ let i = 0; if (dst.length && src.length){ const l = dst[dst.length - 1], f = src[0]; if (Math.abs(l[0] - f[0]) < 1e-9 && Math.abs(l[1] - f[1]) < 1e-9) i = 1; } for (; i < src.length; i++) dst.push(src[i]); return dst; }
function simplify(c, tol){
  if (c.length < 3) return c.slice();
  const k = Math.cos(c[0][0] * D2R) * 111320, xy = c.map(p => [p[1] * k, p[0] * 111320]);
  const keep = new Uint8Array(c.length); keep[0] = keep[c.length - 1] = 1;
  const st = [[0, c.length - 1]];
  while (st.length){
    const [a, b] = st.pop(); const ax = xy[a][0], ay = xy[a][1], dx = xy[b][0] - ax, dy = xy[b][1] - ay, l2 = dx * dx + dy * dy;
    let md = 0, mi = -1;
    for (let i = a + 1; i < b; i++){ let t = l2 ? ((xy[i][0] - ax) * dx + (xy[i][1] - ay) * dy) / l2 : 0; t = t < 0 ? 0 : t > 1 ? 1 : t; const ex = ax + t * dx - xy[i][0], ey = ay + t * dy - xy[i][1], d = ex * ex + ey * ey; if (d > md){ md = d; mi = i; } }
    if (mi > 0 && md > tol * tol){ keep[mi] = 1; st.push([a, mi], [mi, b]); }
  }
  return c.filter((_, i) => keep[i]);
}
function encPoly(c, p = 5){
  const f = 10 ** p; let out = '', pa = 0, po = 0;
  const enc = v => { v = v < 0 ? ~(v << 1) : (v << 1); let s = ''; while (v >= 0x20){ s += String.fromCharCode((0x20 | (v & 0x1f)) + 63); v >>= 5; } return s + String.fromCharCode(v + 63); };
  for (const q of c){ const la = Math.round(q[0] * f), lo = Math.round(q[1] * f); out += enc(la - pa) + enc(lo - po); pa = la; po = lo; }
  return out;
}
function decPoly(s, p = 5){
  const f = 10 ** p, out = []; let i = 0, la = 0, lo = 0;
  const dec = () => { let r = 0, sh = 0, b; do { b = s.charCodeAt(i++) - 63; r |= (b & 0x1f) << sh; sh += 5; } while (b >= 0x20 && i < s.length); return (r & 1) ? ~(r >> 1) : (r >> 1); };
  while (i < s.length){ la += dec(); if (i >= s.length) break; lo += dec(); out.push([la / f, lo / f]); }
  return out;
}

function showBlob(tile, b, done){ const u = URL.createObjectURL(b); tile.onload = () => { URL.revokeObjectURL(u); done(null, tile); }; tile.onerror = () => { URL.revokeObjectURL(u); done(new Error('tuile'), tile); }; tile.src = u; }
const CachedTiles = L.TileLayer.extend({
  createTile(coords, done){
    const tile = document.createElement('img'); tile.alt = ''; tile.setAttribute('role', 'presentation');
    const url = this.getTileUrl(coords);
    const net = () => { tile.onload = () => done(null, tile); tile.onerror = () => { if (hasZones()) this._fallback(coords, tile, done); else done(new Error('tuile'), tile); }; tile.src = url; };
    if (!hasZones()){ net(); return tile; }
    tcache().then(c => c ? c.match(url) : null).then(r => r ? r.blob() : null).then(b => {
      if (b && b.size) showBlob(tile, b, done); else if (offline()) this._fallback(coords, tile, done); else net();
    }, net);
    return tile;
  },
  _fallback(coords, tile, done){
    (async () => {
      const c = await tcache(); if (!c) throw new Error('cache');
      for (let dz = 1; dz <= 6 && coords.z - dz >= 0; dz++){
        const Z = coords.z - dz, X = coords.x >> dz, Y = coords.y >> dz;
        const r = await c.match(L.Util.template(this._url, {z: Z, x: X, y: Y})); if (!r) continue;
        const bm = await createImageBitmap(await r.blob()), sz = (256 >> dz) * bm.width / 256;
        const cv = document.createElement('canvas'); cv.width = cv.height = 256;
        cv.getContext('2d').drawImage(bm, (coords.x - (X << dz)) * sz, (coords.y - (Y << dz)) * sz, sz, sz, 0, 0, 256, 256);
        const b = await new Promise(res => cv.toBlob(res));
        if (b){ showBlob(tile, b, done); return; }
      }
      throw new Error('absente');
    })().catch(() => done(new Error('tuile absente'), tile));
  }
});

async function gpsStart(bg){
  if (BGEO){

const TR = new Map();

  return {id: uid(), type: 'track', src, name, date: t0 || Date.now(), d, up: hasZ ? up : null, dur, t0,
    lines: lines.map(l => ({p: encPoly(l, 6), z: l.map(p => p[2] == null || !isFinite(p[2]) ? null : Math.round(p[2] * 10) / 10), t: l.map(p => p[3] && t0 ? Math.round((p[3] - t0) / 1000) : null)})), wpts: []};

function eleAlong(c){

}

function toGPX(src, name){

  o += '<trk><name>' + esc(name) + '</name>' + (src.desc ? '<desc>' + esc(src.desc) + '</desc>' : '') + '\n';

function loadShared(text){
  const m = /(?:^|[#&?\s])r=([A-Za-z0-9_-]{8,})/.exec(String(text || '').trim()); if (!m) return false;
  try{
    const o = JSON.parse(unb64u(m[1]));
    const wps = decPoly(o.w, 5); if (wps.length < 2) return false;
    pushUndo();
    R.wps = wps; R.segs = o.s.map(x => ({m: x[0] === 'l' ? 'l' : x[0] === 'p' ? 'p' : 'f', c: x[1] ? decPoly(x[1], 5) : null, st: 'ok'}));
    for (let i = 0; i < R.segs.length; i++){ const sg = R.segs[i]; if (sg.c && sg.c.length > 1){ sg.c[0] = R.wps[i]; sg.c[sg.c.length - 1] = R.wps[i + 1]; } else sg.c = [R.wps[i], R.wps[i + 1]]; }
    R.name = o.n || 'Parcours partagé'; R.id = null;
    if (o.p && S.sp[o.p]){ S.prof = o.p; els.prof.value = o.p; }
    changed(); fitRoute(); toast('Parcours partagé ouvert');
    return true;
  }catch(e){ return false; }
}
function readHash(){
  if (!/^#r=/.test(location.hash)) return false;
  const ok = loadShared(location.hash);
  history.replaceState(null, '', location.pathname + location.search);
  if (!ok) toast('Lien de parcours illisible');
  return ok;
}
const txt = (e, tag) => { const c = e.getElementsByTagName(tag)[0]; return c ? c.textContent.trim() : null; };
const tnum = v => v == null || v === '' || !isFinite(+v) ? null : +v;
function parseGPX(doc){
  const pts = list => [...list].map(e => { const tm = txt(e, 'time'); return [+e.getAttribute('lat'), +e.getAttribute('lon'), tnum(txt(e, 'ele')), tm ? (Date.parse(tm) || null) : null]; }).filter(p => isFinite(p[0]) && isFinite(p[1]));
  const lines = [];
  for (const sg of doc.getElementsByTagName('trkseg')){ const l = pts(sg.getElementsByTagName('trkpt')); if (l.length > 1) lines.push(l); }
  for (const rt of doc.getElementsByTagName('rte')){ const l = pts(rt.getElementsByTagName('rtept')); if (l.length > 1) lines.push(l); }
  const wpts = [...doc.getElementsByTagName('wpt')].map(e => [+e.getAttribute('lat'), +e.getAttribute('lon'), txt(e, 'name') || '']).filter(w => isFinite(w[0]) && isFinite(w[1]));
  const nm = [...doc.getElementsByTagName('name')].find(e => /^(metadata|trk|rte)$/i.test(e.parentNode && e.parentNode.localName));
  return {name: nm ? nm.textContent.trim() : '', lines, wpts};
}
function parseKML(doc){
  const lines = [], wpts = [];
  for (const ls of doc.getElementsByTagName('LineString')){ const c = ls.getElementsByTagName('coordinates')[0]; if (!c) continue; const l = c.textContent.trim().split(/\s+/).map(s => s.split(',').map(Number)).filter(a => a.length >= 2 && isFinite(a[0]) && isFinite(a[1])).map(a => [a[1], a[0], a.length > 2 && isFinite(a[2]) ? a[2] : null, null]); if (l.length > 1) lines.push(l); }
  for (const tr of doc.getElementsByTagNameNS('*', 'Track')){ const co = tr.getElementsByTagNameNS('*', 'coord'), wh = tr.getElementsByTagNameNS('*', 'when'), l = []; for (let q = 0; q < co.length; q++){ const a = co[q].textContent.trim().split(/\s+/).map(Number); if (a.length >= 2 && isFinite(a[0]) && isFinite(a[1])) l.push([a[1], a[0], isFinite(a[2]) ? a[2] : null, wh[q] ? (Date.parse(wh[q].textContent) || null) : null]); } if (l.length > 1) lines.push(l); }
  for (const pm of doc.getElementsByTagName('Placemark')){ const pt = pm.getElementsByTagName('Point')[0]; if (!pt) continue; const c = pt.getElementsByTagName('coordinates')[0]; if (!c) continue; const a = c.textContent.trim().split(',').map(Number); if (isFinite(a[0]) && isFinite(a[1])) wpts.push([a[1], a[0], txt(pm, 'name') || '']); }
  const nm = doc.getElementsByTagName('name')[0];
  return {name: nm ? nm.textContent.trim() : '', lines, wpts};
}
function parseGeoJSON(j){
  const lines = [], wpts = []; let name = '';
  const cv = a => [a[1], a[0], a.length > 2 && isFinite(a[2]) ? a[2] : null, null];
  const geo = (g, pr) => { if (!g) return; const T = g.type, C = g.coordinates;
    if (T === 'LineString') lines.push(C.map(cv)); else if (T === 'MultiLineString') C.forEach(l => lines.push(l.map(cv)));
    else if (T === 'Polygon') lines.push(C[0].map(cv)); else if (T === 'MultiPolygon') C.forEach(p => lines.push(p[0].map(cv)));
    else if (T === 'Point') wpts.push([C[1], C[0], (pr && pr.name) || '']); else if (T === 'GeometryCollection') (g.geometries || []).forEach(x => geo(x, pr)); };
  if (j.type === 'FeatureCollection') (j.features || []).forEach(f => { if (!name && f.properties && f.properties.name) name = f.properties.name; geo(f.geometry, f.properties); });
  else if (j.type === 'Feature'){ name = (j.properties && j.properties.name) || ''; geo(j.geometry, j.properties); }
  else geo(j);
  return {name, lines: lines.filter(l => l.length > 1), wpts};
}
async function importFile(file){
  const text = await file.text(), t = text.replace(/^﻿/, '').trimStart();
  let res = null;
  if (t.startsWith('<')){
    const doc = new DOMParser().parseFromString(t, 'application/xml');
    if (doc.getElementsByTagName('parsererror').length) throw new Error('fichier XML illisible');
    const root = (doc.documentElement.localName || '').toLowerCase();
    res = root === 'gpx' ? parseGPX(doc) : root === 'kml' ? parseKML(doc) : null;
    if (!res) throw new Error('format non reconnu (GPX ou KML attendu)');
  } else {
    const j = JSON.parse(t);
    if (j && j.app === 'abef-sentiers' && Array.isArray(j.items)){
      const cur = lib(), ids = new Set(cur.map(x => x.id)); let n = 0;
      for (const it of j.items) if (it && it.id && !ids.has(it.id)){ cur.push(it); n++; }
      cur.sort((a, b) => (b.date || 0) - (a.date || 0)); libSave(cur);
      toast(n + ' parcours ajouté' + (n > 1 ? 's' : '') + ' depuis la sauvegarde'); return;
    }
    res = parseGeoJSON(j);
  }
  if (!res.lines.length) throw new Error('aucune trace dans ce fichier');
  const name = res.name || file.name.replace(/\.[^.]+$/, '');
  const it = trackItem(name, res.lines, 'import'); it.wpts = res.wpts.slice(0, 200);
  libAdd(it); showTrace(it, true);
  toast('« ' + name + ' » importé (' + fmtKm(it.d) + ')');
}

const OFFL = {
  plan: {n: 'Plan IGN', d: 'chemins, sentiers, routes, relief', kb: 20, tpl: () => IGNW('GEOGRAPHICALGRIDSYSTEMS.PLANIGNV2', 'image/png')},
  ortho: {n: 'Photos aériennes IGN', d: 'pour repérer un chemin absent des cartes', kb: 30, tpl: () => IGNW('ORTHOIMAGERY.ORTHOPHOTOS', 'image/jpeg')},
  scan25: {n: 'Carte IGN SCAN 25', d: 'avec votre clé IGN', kb: 35, key: true, tpl: SCANW}
};
const MAX_TILES = 15000, MAX_CELLS = 90;
const lon2x = (lo, z) => Math.max(0, Math.min(2 ** z - 1, Math.floor((lo + 180) / 360 * 2 ** z)));
const lat2y = (la, z) => { const r = la * D2R; return Math.max(0, Math.min(2 ** z - 1, Math.floor((1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * 2 ** z))); };
const x2lon = (x, z) => x / 2 ** z * 360 - 180;
const y2lat = (y, z) => Math.atan(Math.sinh(Math.PI - 2 * Math.PI * y / 2 ** z)) / D2R;
function distLine(p, c){ if (c.length === 1) return hav(p, c[0]); let d = Infinity; for (let i = 0; i < c.length - 1; i++){ const r = projSeg(p, c[i], c[i + 1]); if (r.d < d) d = r.d; } return d; }
function zoneTiles(z){
  const out = [];
  for (let k = z.z0; k <= z.z1; k++){
    const x0 = lon2x(z.w, k), x1 = lon2x(z.e, k), y0 = lat2y(z.n, k), y1 = lat2y(z.s, k);
    const half = 40075016 * Math.cos((z.s + z.n) / 2 * D2R) / 2 ** k * 0.72;
    for (let x = x0; x <= x1; x++) for (let y = y0; y <= y1; y++){
      if (z.line && k >= 13 && distLine([(y2lat(y, k) + y2lat(y + 1, k)) / 2, (x2lon(x, k) + x2lon(x + 1, k)) / 2], z.line) > z.buf + half) continue;
      out.push([k, x, y]);
    }
  }
  return out;
}
function zoneCells(z){
  const cells = cellsBB(z.s, z.w, z.n, z.e);
  return z.line ? cells.filter(([ci, cj]) => { const bb = cellBB(ci, cj); return distLine([(bb.s + bb.n) / 2, (bb.w + bb.e) / 2], z.line) < z.buf + 2000; }) : cells;
}
async function pool(items, n, fn){ let i = 0; const run = async () => { while (i < items.length){ const k = i++; await fn(items[k], k); } }; await Promise.all(Array.from({length: Math.min(n, items.length)}, run)); }
function progress(title){

  d.innerHTML = '<form method="dialog"><header><h2>' + esc(title) + '</h2></header><div class="body"><p class="pstep">Préparation…</p><div class="bar"><i></i></div><p class="note num pdet"></p><p class="note">Gardez l’écran allumé et ' + (CAP ? 'l’appli' : 'cette page') + ' ouverte pendant le téléchargement.</p></div><footer><button class="btn" value="cancel">Annuler</button></footer></form>';

    close(){ if (d.open) d.close('done'); d.remove(); }};
}
async function demGrid(z, id, P){
  const latM = (z.n - z.s) * 111320, lonM = (z.e - z.w) * 111320 * Math.cos((z.s + z.n) / 2 * D2R);
  const area = z.line ? Math.max(500, lineLen(z.line)) * 2 * (z.buf + 300) : latM * lonM;
  const step = Math.max(30, Math.sqrt(area / 30000));
  const ny = Math.max(2, Math.ceil(latM / step) + 1), nx = Math.max(2, Math.ceil(lonM / step) + 1);
  const idx = [], pts = [];
  for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++){
    const p = [z.s + (z.n - z.s) * j / (ny - 1), z.w + (z.e - z.w) * i / (nx - 1)];
    if (z.line && distLine(p, z.line) > z.buf + 2 * step) continue;
    idx.push(j * nx + i); pts.push(p);
  }
  if (!pts.length || pts.length > 60000) return false;
  const v = await getElevNet(pts, P.signal, f => P.set('Altitudes', 0.82 + 0.18 * f, fmtInt(Math.round(f * pts.length)) + ' / ' + fmtInt(pts.length) + ' points'));
  const Z = new Float32Array(nx * ny).fill(NaN); idx.forEach((k, q) => { Z[k] = v[q]; });
  await IDB.set(id, {id, s: z.s, w: z.w, n: z.n, e: z.e, nx, ny, z: Z}, 'dem');
  DEMS = null; return true;
}
async function runZone(z, lays, withNet, withDem, keep){
  NETST.down = 0;
  if (navigator.onLine === false){ toast('Pas de connexion : téléchargement impossible pour le moment'); return; }
  const cache = await tcache();
  if (!cache){ toast('Ce navigateur ne permet pas de garder des cartes hors ligne'); return; }
  try{ if (navigator.storage && navigator.storage.persist) await navigator.storage.persist(); }catch(e){}
  const P = progress('Téléchargement : ' + z.name);
  let wl = null; try{ if ('wakeLock' in navigator) wl = await navigator.wakeLock.request('screen'); }catch(e){}
  const id = keep ? z.id : 'z' + uid(), tiles = zoneTiles(z), urls = [];
  for (const k of lays) for (const t of tiles) urls.push(L.Util.template(OFFL[k].tpl(), {z: t[0], x: t[1], y: t[2]}));
  const got = []; let done = 0, bytes = 0, bad = 0, cells = keep ? z.cells : 0, dem = keep ? !!z.dem : false, netBad = false;
  try{
    await pool(urls, 6, async u => {
      if (P.signal.aborted) return;
      const have = await cache.match(u);
      if (have) bytes += +(have.headers.get('content-length') || 0) || OFFL.plan.kb * 1024;
      else {
        let ok = false;
        for (let a = 0; a < 3 && !ok && !P.signal.aborted; a++){
          try{ const res = await fetchT(u, {signal: P.signal}, 25000); if (res.ok){ const b = await res.clone().blob(); await cache.put(u, res); bytes += b.size; got.push(u); ok = true; } else if (res.status === 400 || res.status === 404) break; else await sleep(600 * (a + 1)); }
          catch(e){ if (P.signal.aborted) break; await sleep(600 * (a + 1)); }
        }
        if (!ok) bad++;
      }
      done++;
      if (done % 8 === 0 || done === urls.length) P.set('Fond de carte', 0.7 * done / urls.length, fmtInt(done) + ' / ' + fmtInt(urls.length) + ' tuiles · ' + fmtMB(bytes));
    });
    if (P.signal.aborted) throw new Error('annulé');
    if (withNet){
      const cl = zoneCells(z).slice(0, MAX_CELLS); cells = cl.length;
      for (let i = 0; i < cl.length; i += 6){
        if (P.signal.aborted) throw new Error('annulé');
        P.set('Chemins (OpenStreetMap et IGN)', 0.7 + 0.12 * i / cl.length, fmtInt(i) + ' / ' + fmtInt(cl.length) + ' secteurs');
        await ensureCells(cl.slice(i, i + 6));
        if (NET.err) netBad = true;
      }
    }
    if (withDem){ P.set('Altitudes', 0.82, ''); dem = (await demGrid(z, id, P)) || dem; }
    if (P.signal.aborted) throw new Error('annulé');
    const zone = {id, name: z.name, date: Date.now(), s: z.s, w: z.w, n: z.n, e: z.e, z0: z.z0, z1: z.z1, line: z.line || null, buf: z.buf || 0, layers: lays, tiles: urls.length, bytes, bad, cells, dem};
    ZONES = [zone].concat(ZONES.filter(x => x.id !== id)); LS.set('zones', ZONES);
    P.close(); offUI(); drawZones(true); setTimeout(() => drawZones(offline()), 8000);
    toast('« ' + z.name + ' » est prête hors ligne : ' + fmtInt(urls.length) + ' tuiles, ' + fmtMB(bytes) + (bad ? ', ' + fmtInt(bad) + ' tuiles manquantes' : '') + (netBad ? ', chemins incomplets' : ''), 7000);
  }catch(e){
    P.close();
    if (P.signal.aborted){ if (!keep){ for (const u of got) cache.delete(u); IDB.del(id, 'dem'); DEMS = null; } toast('Téléchargement annulé'); }
    else toast('Téléchargement interrompu : ' + ((e && e.message) || e), 6000);
  } finally { try{ if (wl) wl.release(); }catch(e){} }
}

async function delZone(id){
  const z = ZONES.find(x => x.id === id); if (!z) return;
  const others = ZONES.filter(x => x.id !== id), cache = await tcache();
  busy(true, 'Suppression…');
  try{
    if (cache){
      const del = [];
      for (const k of z.layers) if (OFFL[k]) for (const [zz, x, y] of zoneTiles(z)){
        if (others.some(o => o.layers.includes(k) && zz >= o.z0 && zz <= o.z1 && x >= lon2x(o.w, zz) && x <= lon2x(o.e, zz) && y >= lat2y(o.n, zz) && y <= lat2y(o.s, zz))) continue;
        del.push(L.Util.template(OFFL[k].tpl(), {z: zz, x, y}));
      }
      for (let i = 0; i < del.length; i += 50) await Promise.all(del.slice(i, i + 50).map(u => cache.delete(u)));
    }
    await IDB.del(id, 'dem'); DEMS = null;
    ZONES = others; LS.set('zones', ZONES); offUI(); drawZones(offline());
  } finally { busy(false); }
}

  const st = await storageTxt();
  const draw = d => {
    d.querySelector('.zones').innerHTML = ZONES.length ? ZONES.map(z => '<li data-id="' + esc(z.id) + '"><div class="t">' + esc(z.name) + '</div><div class="m num">' + dateFR(z.date) + ' · ' + z.layers.map(k => OFFL[k] ? OFFL[k].n : k).join(' + ') + ' · zoom ' + z.z0 + '–' + z.z1 + ' · ' + fmtInt(z.tiles) + ' tuiles, ' + fmtMB(z.bytes) + (z.cells ? ' · chemins' : '') + (z.dem ? ' · altitudes' : '') + (z.bad ? ' · ' + fmtInt(z.bad) + ' tuiles manquantes' : '') + '</div><div class="a"><button type="button" class="btn" data-a="see">Voir</button>' + (z.bad ? '<button type="button" class="btn" data-a="fix">Compléter</button>' : '') + '<button type="button" class="btn danger" data-a="del">Supprimer</button></div></li>').join('') : '<li class="note">Aucune zone téléchargée. Avant de partir sans réseau, téléchargez la zone affichée ou les abords de votre parcours.</li>';
  };
  modal({title: 'Cartes hors ligne', wide: true, actions: [],
    html: '<p class="note">' + (offline() ? '<b>Vous êtes hors ligne.</b> ' : '') + 'Téléchargez à l’avance le fond IGN, les chemins et les altitudes : la carte, le tracé par les chemins et le dénivelé marcheront ensuite sans réseau.</p><div class="wrap"><button type="button" class="btn primary" data-a="view">' + ic('download') + 'Zone affichée</button>' + (R.wps.length > 1 ? '<button type="button" class="btn" data-a="route">' + ic('path') + 'Autour du parcours</button>' : '') + '</div><h3>Zones téléchargées</h3><ul class="lib zones"></ul><p class="note">' + esc(st) + '</p>',
    onOpen: d => {
      draw(d);
      d.addEventListener('click', async ev => {
        const b = ev.target.closest('button[data-a]'); if (!b) return; const a = b.dataset.a;
        if (a === 'view' || a === 'route'){ d.close(''); zoneDialog(a); return; }
        const li = b.closest('li'), z = li && ZONES.find(x => x.id === li.dataset.id); if (!z) return;
        if (a === 'see'){ d.close(''); fitTo(L.latLngBounds([[z.s, z.w], [z.n, z.e]])); drawZones(true); setTimeout(() => drawZones(offline()), 8000); }
        else if (a === 'fix'){ d.close(''); runZone(Object.assign({}, z), z.layers, false, false, true); }
        else if (a === 'del'){ if (await confirmBox('Supprimer la zone', '« ' + z.name + ' » ne sera plus disponible hors ligne.', 'Supprimer')){ await delZone(z.id); draw(d); } }
      });
    }});
}
els.bOff.onclick = openOffline;
let offState = null;
function offUI(){
  const off = offline(); els.offBadge.hidden = !off; els.bOff.title = off ? 'Hors ligne : cartes téléchargées' : 'Cartes hors ligne';
  if (off !== offState){ offState = off; drawZones(off); if (!NET.fly.size) netStatus(NET.err && !off ? 'err' : NET.G ? 'ok' : ''); }
}
window.addEventListener('online', () => { NETST.down = 0; offUI(); });
window.addEventListener('offline', offUI);
setInterval(offUI, 10000);

/* ================= calques et réglages ================= */
function openLayers(){
  const bases = Object.entries(BASES).map(([k, b]) => '<label class="check"><input type="radio" name="base" value="' + k + '"' + (S.base === k ? ' checked' : '') + (b.key && !S.scanKey ? ' disabled' : '') + '><span>' + b.n + '<br><small>' + b.d + '</small></span></label>').join('');
  const ovs = Object.entries(OVERLAYS).map(([k, o]) => '<label class="check"><input type="checkbox" data-ov="' + k + '"' + (S.ov[k] ? ' checked' : '') + '><span>' + o.n + '<br><small>' + o.d + '</small></span></label>').join('');
  modal({title: 'Carte', actions: [{label: 'Fermer', value: true, primary: true}],
    html: '<h3>Fond de carte</h3>' + bases + '<h3>Calques</h3><label class="check"><input type="checkbox" data-x="net"' + (S.net ? ' checked' : '') + '><span>Chemins chargés<br><small>montre les chemins que le tracé peut suivre (dès le zoom 13)</small></span></label><label class="check"><input type="checkbox" data-x="km"' + (S.km ? ' checked' : '') + '><span>Bornes kilométriques<br><small>sur votre tracé</small></span></label>' + ovs,
    onOpen: d => d.addEventListener('change', ev => {
      const i = ev.target;
      if (i.name === 'base') setBase(i.value);
      else if (i.dataset.ov) setOverlay(i.dataset.ov, i.checked);
      else if (i.dataset.x === 'net'){ S.net = i.checked; saveS(); drawNet(); }
      else if (i.dataset.x === 'km'){ S.km = i.checked; saveS(); renderRoute(); }
    })});
}
async function openSettings(){
  const sp = S.sp, n = (name, v, step = 1) => '<input type="number" inputmode="decimal" name="' + name + '" value="' + v + '" min="0" step="' + step + '">';
  const r = await modal({title: 'Réglages', wide: true, actions: [{label: 'Enregistrer', value: true, primary: true}, {label: 'Annuler', value: null}],
    html: '<h3>Estimation du temps</h3><p class="note">À pied : méthode DIN 33466 (temps à plat et temps de dénivelé combinés). À vélo : temps à plat plus temps de montée.</p>' +
      '<div class="field"><span>À pied : km/h · m/h en montée · m/h en descente</span><div class="trio">' + n('mv', sp.marche.v, .1) + n('mu', sp.marche.up, 10) + n('md', sp.marche.dn, 10) + '</div></div>' +
      '<div class="field"><span>VTT : km/h à plat · m/h en montée</span><div class="trio">' + n('vv', sp.vtt.v, .5) + n('vu', sp.vtt.up, 10) + '</div></div>' +
      '<div class="field"><span>Vélo de route : km/h à plat · m/h en montée</span><div class="trio">' + n('rv', sp.route.v, .5) + n('ru', sp.route.up, 10) + '</div></div>' +
      '<h3>Chemins suivis par le tracé</h3><label class="field"><span>Sources</span><select name="src"><option value="both"' + (S.src === 'both' ? ' selected' : '') + '>OpenStreetMap + IGN BD TOPO (le plus complet)</option><option value="osm"' + (S.src === 'osm' ? ' selected' : '') + '>OpenStreetMap seul</option><option value="ign"' + (S.src === 'ign' ? ' selected' : '') + '>IGN BD TOPO seul</option></select></label>' +
      '<label class="check"><input type="checkbox" name="auto"' + (S.auto ? ' checked' : '') + '><span>Charger les chemins automatiquement à partir du zoom 14</span></label>' +
      '<div class="wrap"><button type="button" class="btn" data-a="cache">Vider le cache des chemins</button></div>' +
      '<h3>Enregistrement GPS</h3><div class="field"><span>Précision minimale acceptée (m) · écart minimal entre deux points (m)</span><div class="trio">' + n('acc', S.acc, 1) + n('gap', S.gap, 1) + '</div></div>' +
      '<p class="note">' + (CAP ? 'L’appli continue d’enregistrer écran éteint : une notification reste affichée pendant l’enregistrement.' : 'Le navigateur suspend le GPS quand l’écran se verrouille : l’écran reste allumé pendant l’enregistrement quand l’appareil le permet. L’appli Android, elle, enregistre écran éteint.') + '</p>' +
      (CAP ? '<h3>Liens de parcours</h3><label class="field"><span>Adresse de votre version web (facultatif)</span><input type="url" name="web" autocomplete="off" placeholder="https://…" value="' + esc(S.webBase) + '"></label><p class="note">Sert à fabriquer des liens cliquables depuis l’appli.</p>' : '') +
      '<h3>Carte IGN SCAN 25</h3><label class="field"><span>Clé personnelle IGN (facultatif)</span><input type="password" name="key" autocomplete="off" value="' + esc(S.scanKey) + '"></label><p class="note">La SCAN 25 (la carte au 1:25 000) demande une clé IGN personnelle. Sans clé, le Plan IGN et les photos aériennes restent disponibles.</p>' +
      '<h3>Cartes hors ligne</h3><p class="note">Bouton nuage à droite de la carte : téléchargez une zone ou les abords d’un parcours avant de partir.</p>' +
      '<h3>Sources</h3><p class="note">Fonds : IGN Géoplateforme, OpenStreetMap, OpenTopoMap, CyclOSM, Waymarked Trails. Chemins : OpenStreetMap (Overpass, ODbL) et BD TOPO® IGN (WFS, Licence ouverte). Altitudes : RGE ALTI® IGN, à défaut Copernicus via Open-Meteo. Recherche : Géoplateforme IGN.</p>',
    onOpen: d => d.addEventListener('click', ev => { const b = ev.target.closest('[data-a=cache]'); if (b){ IDB.clear(); NET.ways.clear(); NET.feats.clear(); NET.oc.clear(); NET.gc.clear(); NET.G = null; NET.dirty = false; drawNet(); netStatus(''); toast('Cache des chemins vidé'); autoLoad(); } })});
  if (!r || !r.value) return;
  const f = r.data, num = (v, d) => { const x = parseFloat(String(v).replace(',', '.')); return isFinite(x) && x > 0 ? x : d; };
  S.sp.marche = {v: num(f.mv, 4), up: num(f.mu, 300), dn: num(f.md, 500)};
  S.sp.vtt = {v: num(f.vv, 14), up: num(f.vu, 600)};
  S.sp.route = {v: num(f.rv, 24), up: num(f.ru, 800)};
  S.acc = num(f.acc, 30); S.gap = num(f.gap, 5); S.auto = !!f.auto;
  if (CAP) S.webBase = (f.web || '').trim();
  const keyChanged = (f.key || '').trim() !== S.scanKey; S.scanKey = (f.key || '').trim();
  const srcChanged = f.src && f.src !== S.src; if (f.src) S.src = f.src;
  saveS();
  if (keyChanged && (S.base === 'scan25' || S.scanKey)) setBase(S.scanKey ? 'scan25' : 'plan');
  if (srcChanged){ NET.dirty = true; rebuild(); autoLoad(); }
  updateStats(); updateFollow(); toast('Réglages enregistrés');
}

/* ================= démarrage ================= */
setMode(S.mode);
const dr = LS.get('draft', null);
if (dr && Array.isArray(dr.w)){ R.wps = dr.w; R.segs = Array.isArray(dr.s) ? dr.s : []; R.name = dr.n || ''; R.id = dr.id || null; if (R.segs.length !== Math.max(0, R.wps.length - 1)){ R.wps = []; R.segs = []; } }
changed();
if (!readHash() && R.wps.length > 1 && !LS.get('view', null)) fitRoute();
netStatus('');
if (map.getZoom() >= 14) autoLoad();
const pend = LS.get('rec', null);
if (pend && Array.isArray(pend.segs) && pend.segs.some(s => s.length)){
  setTimeout(async () => {
    const d = pend.dist || 0;
    const r = await modal({title: 'Enregistrement interrompu', html: '<p>Un enregistrement GPS était en cours (' + fmtKm(d) + ', commencé le ' + esc(dateStr(pend.tStart)) + ').</p>', actions: [{label: 'Reprendre', value: 'go', primary: true}, {label: 'Enregistrer la trace', value: 'save'}, {label: 'Supprimer', value: 'drop', danger: true}]});
    const v = r && r.value;
    if (v === 'go'){
      if (!(await gpsStart(true))) return;
      Object.assign(REC, {on: true, paused: !!pend.paused, segs: pend.segs, lines: [], tStart: pend.tStart, pausedMs: pend.pausedMs || 0, pauseAt: pend.pauseAt || 0, dist: d, up: pend.up || 0, altRef: NaN, movT: pend.movT || 0, savedAt: 0});
      for (const s of REC.segs){ const l = recLine(); l.setLatLngs(s.map(p => [p[0], p[1]])); REC.lines.push(l); }
      if (!REC.paused) newRecSeg();
      GPS.follow = true; wakeOn(); recUI(); clearInterval(recTimer); recTimer = setInterval(() => { if (!document.hidden) recUI(); }, 1000);
    } else if (v === 'save'){
      const segs = pend.segs.filter(s => s.length > 1);
      if (segs.length){ const it = trackItem('Trace du ' + dateStr(pend.tStart), segs, 'gps'); libAdd(it); showTrace(it, true); toast('Trace enregistrée dans « Mes parcours »'); }
      LS.del('rec');
    } else if (v === 'drop'){ if (await confirmBox('Supprimer la trace', 'La trace GPS interrompue sera perdue.', 'Supprimer')) LS.del('rec'); }
  }, 400);
}
offUI();
// appli Android : bouton retour et retour au premier plan
if (APPP){
  try{
    APPP.addListener('backButton', () => {
      const d = [...document.querySelectorAll('dialog[open]')].pop();
      if (d){ d.close(d.dataset.cancel ? 'cancel' : ''); return; }
      const pop = map._popup; if (pop && pop.isOpen && pop.isOpen()){ map.closePopup(); return; }
      if (!els.results.hidden){ els.results.hidden = true; return; }
      if (els.panel.classList.contains('open')){ els.grab.click(); return; }
      APPP.minimizeApp();
    });
    APPP.addListener('appStateChange', st => { if (st && st.isActive){ map.invalidateSize(); recUI(); offUI(); updateFollow(); if (REC.on && GPS.follow && GPS.last) map.panTo(GPS.last.p); } });
  }catch(e){}
}
// version web installable : fonctionnement hors ligne de la page elle-même
if (!CAP && 'serviceWorker' in navigator && (location.protocol === 'https:' || /^(localhost|127\.0\.0\.1)$/.test(location.hostname))) window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
window.ABEF = {map, R, NET, S, REC, GPS, TR, PRO, Q, ZONES: () => ZONES, buildGraph, astar, snapG, offline, NETST, loadDems, demAt};
}
</script>
</body>
</html>
